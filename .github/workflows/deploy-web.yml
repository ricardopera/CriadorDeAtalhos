name: Deploy Web App to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths: ["web/**"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Copy web files to pages root
        run: |
          # Create a temporary directory for pages content
          mkdir -p _site
          
          # Copy web directory contents
          cp -r web/* _site/
          
          # Copy favicon from root
          cp favicon.ico _site/ 2>/dev/null || echo "No favicon found in root"
          
          # Create a simple redirect from root to web app
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>Criador de Atalhos</title>
              <meta http-equiv="refresh" content="0; url=./web/">
              <link rel="canonical" href="./web/" />
              <style>
                  body { 
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
                      text-align: center; 
                      padding: 50px;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white;
                      min-height: 100vh;
                      margin: 0;
                      display: flex;
                      flex-direction: column;
                      justify-content: center;
                  }
                  .loading {
                      font-size: 1.5em;
                      margin-bottom: 20px;
                  }
                  .link {
                      color: #fff;
                      text-decoration: underline;
                      font-weight: bold;
                  }
              </style>
          </head>
          <body>
              <div class="loading">🔗 Redirecionando para o Criador de Atalhos...</div>
              <p>Se o redirecionamento não funcionar, <a href="./web/" class="link">clique aqui</a></p>
              <script>
                  setTimeout(() => {
                      window.location.href = './web/';
                  }, 1000);
              </script>
          </body>
          </html>
          EOF
          
          # Fix web app to work from subdirectory
          sed -i 's|href="css/|href="./css/|g' _site/web/index.html || echo "No CSS links to fix"
          sed -i 's|src="js/|src="./js/|g' _site/web/index.html || echo "No JS links to fix"
          sed -i 's|href="../favicon.ico"|href="./favicon.ico"|g' _site/web/index.html || echo "No favicon link to fix"
          
          # Ensure proper directory structure
          ls -la _site/
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4